name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. कोड को चेकआउट करना
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java एनवायरनमेंट सेट करना (Android बिल्ड के लिए ज़रूरी)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Android SDK और cmdline-tools को सही तरीके से सेटअप करना (जो एरर आ रहा था उसे यह फिक्स करेगा)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11.0 # नया वर्जन जिससे 'tools' पैकेज का एरर नहीं आएगा
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # 4. Android के सभी लाइसेंस को ऑटोमैटिक स्वीकार (Accept) करना
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 5. ग्रैडल (Gradle) को रन करने की परमिशन देना
      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 6. प्रोजेक्ट को बिल्ड करना (APK बनाना)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 7. बने हुए APK को डाउनलोड के लिए सेव करना
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
