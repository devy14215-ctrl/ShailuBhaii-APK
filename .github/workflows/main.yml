name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Excel library bundled inside the APK so Excel export/restore also works offline
      - name: Bundle Excel library (offline support)
        run: |
          curl -fsSL --retry 3 -o app/src/main/assets/xlsx.full.min.js \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js || true
          if [ ! -s app/src/main/assets/xlsx.full.min.js ] || [ "$(wc -c < app/src/main/assets/xlsx.full.min.js)" -lt 100000 ]; then
            rm -f app/src/main/assets/xlsx.full.min.js
            echo "Excel library not bundled - app will load it online instead"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ShailuBhai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShailuBhai-APK
          path: ShailuBhai.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Shailu Bhai APK (build ${{ github.run_number }})
          files: ShailuBhai.apk
