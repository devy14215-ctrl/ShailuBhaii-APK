name: Build Shailu Bhai APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ShailuBhai-GitHub-APK-Project.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q ShailuBhai-GitHub-APK-Project.zip -d build-project

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        working-directory: build-project/shailubhai-apk
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShailuBhai-DailyCollection-APK
          path: build-project/shailubhai-apk/app/build/outputs/apk/debug/app-debug.apk
